<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exerfly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Exerfly — katalóg cvikov s 3D animáciami, technikou a mapou zapojených svalov.">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Exerfly">
<meta property="og:description" content="Katalóg cvikov s 3D animáciami, technikou a mapou svalov.">
<meta property="og:image" content="assets/logo/icon-512.png">
<script>
  /* тема до отрисовки страницы, чтобы не было вспышки */
  (function () {
    var t; try { t = localStorage.getItem('exerfly-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<!-- иконки: SVG для современных браузеров, ICO/PNG — запасные, apple-touch — для iPhone/iPad, manifest — для Android -->
<link rel="icon" id="favicon" type="image/svg+xml" href="assets/logo/favicon-light.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<button type="button" class="skip-link" id="skip">Preskočiť na obsah</button>

<header class="site-header" id="site-header">
  <div class="wrap">
    <a class="logo" href="#" id="logo-link" aria-label="Exerfly">
      <svg class="logo-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
        <path class="hot" d="M12 67C32 31 72 14 116 12C92 43 56 59 12 67Z"/>
        <path d="M27 88C46 59 77 44 108 41C88 66 60 81 27 88Z"/>
        <path d="M45 108C60 87 80 75 101 72C85 91 66 102 45 108Z"/>
      </svg>
      <span class="logo-word">Exerfly</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <button type="button" class="theme-toggle" id="theme" role="switch" aria-checked="false">
        <span class="pill-bg" aria-hidden="true"></span>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1Z"/></svg>
      </button>
      <div class="lang-dd" id="lang"></div>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap"><p id="footer-note"></p></div>
</footer>

<script src="js/data.js"></script>
<script src="js/lang/sk.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/lang/uk.js"></script>
<script src="js/lang/ru.js"></script>
<script src="js/app.js"></script>
</body>
</html>
